[package]
name = "muninn-mcp"
version = "0.2.2"
edition = "2024"
rust-version = "1.100"
description = "MCP server for a Markdown knowledge base: notes, observations, relations and hybrid search"
license = "MIT"
readme = "README.md"
repository = "https://github.com/vitoramaral10/muninn-mcp"
keywords = ["mcp", "mcp-server", "knowledge-base", "markdown", "llm"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
env_logger = { version = "0.11", default-features = false }
log = "0.4"
# reqwest only talks plain HTTP to the embedding server: no TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { version = "3.10.0", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.43", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# yaml_serde (maintained by the YAML Organization) replaces serde_yaml_ng, unmaintained since 2024 and
# built on the unmaintained unsafe-libyaml. Same serde_yaml API; the old name keeps the code unchanged.
serde_yaml_ng = { package = "yaml_serde", version = "0.10.7" }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
unicode-normalization = "0.1"

[dev-dependencies]
# A real client for the end-to-end tests: the 2026-07-28 lifecycle and MRTR, as the gateway speaks it.
rmcp = { version = "3.10.0", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

[lints.cargo]
unused_dependencies = "warn"
